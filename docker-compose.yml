
x-common:
  database:
    &db-environment
    # Do not remove the "&db-password" from the end of the line below, it is important
    # for Panel functionality.
    MYSQL_PASSWORD: &db-password "CHANGE_ME"
    MYSQL_ROOT_PASSWORD: "CHANGE_ME_TOO"
  panel:
    &panel-environment
    APP_DEBUG: true
    APP_URL: "http://triton"
    # A list of valid timezones can be found here: http://php.net/manual/en/timezones.php
    APP_TIMEZONE: "UTC"
    APP_SERVICE_AUTHOR: "CHANGEME@example.com"
    # Uncomment the line below and set to a non-empty value if you want to use Let's Encrypt
    # to generate an SSL certificate for the Panel.
    # LE_EMAIL: ""
    APP_CORS_ALLOWED_ORIGINS: "*"
  mail:
    &mail-environment
    MAIL_FROM: "noreply@example.com"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "mail"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "true"

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#
services:
  database:
    image: mariadb:10.5
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "/var/lib/pterodactyl/database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
  cache:
    image: redis:alpine
    restart: always
  wings:
    image: ghcr.io/pterodactyl/wings:latest
    restart: always
    privileged: true
    ports:
      - "8080:8080"  # Panel -> Wings API
      - "2022:2022"  # SFTP
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/pterodactyl/wings:/etc/pterodactyl"
      - "/var/lib/pterodactyl/servers:/var/lib/pterodactyl/servers"
      - "/tmp/pterodactyl:/tmp/pterodactyl"
    environment:
      TZ: "UTC"
      # run as root inside the container (simple for a single-host setup)
      WINGS_UID: 0
      WINGS_GID: 0
      WINGS_USERNAME: root
      WINGS_NODE_ID: 1
      PANEL_URL: "http://triton"
    networks:
      default:
        aliases:
          - triton
  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    links:
      - wings
      - database
      - cache
    volumes:
      - "/var/lib/pterodactyl/var/:/app/var/"
      - "/var/lib/pterodactyl/nginx/:/etc/nginx/http.d/"
      - "/var/lib/pterodactyl/certs/:/etc/letsencrypt/"
      - "panel-logs:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
    networks:
      default:
        aliases:
          - triton
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
volumes:
  panel-logs:
